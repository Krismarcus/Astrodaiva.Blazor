<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#074252">
    <meta name="color-scheme" content="light">
    <meta name="application-name" content="Astrodaiva">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Astrodaiva">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <title>Astrodaiva</title>
    <base href="./" />
    <script>
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {
            window.dataLayer.push(arguments);
        };

        (function () {
            var measurementId = "G-9EPVXNMWJX";
            var consentKey = "astrodaivaAnalyticsConsent";

            function readConsent() {
                try {
                    return window.localStorage.getItem(consentKey) || "unset";
                } catch (error) {
                    return "unset";
                }
            }

            function writeConsent(value) {
                try {
                    window.localStorage.setItem(consentKey, value);
                } catch (error) {
                    // Ignore storage failures and keep analytics disabled.
                }
            }

            function isBlockedUrl(url) {
                var target = new URL(url || window.location.href, window.location.origin);
                var host = target.hostname.toLowerCase();
                var path = target.pathname.toLowerCase();

                return host === "localhost"
                    || host === "127.0.0.1"
                    || host === "::1"
                    || path === "/admin"
                    || path.indexOf("/admin/") === 0;
            }

            gtag("consent", "default", {
                analytics_storage: readConsent() === "granted" ? "granted" : "denied",
                ad_storage: "denied",
                ad_user_data: "denied",
                ad_personalization: "denied"
            });
            gtag("js", new Date());
            gtag("config", measurementId, { send_page_view: false });

            window.astroAnalytics = {
                getConsent: readConsent,
                setConsent: function (granted) {
                    var value = granted ? "granted" : "denied";
                    writeConsent(value);
                    gtag("consent", "update", { analytics_storage: value });
                },
                trackPageView: function (url, title) {
                    if (readConsent() !== "granted" || isBlockedUrl(url)) {
                        return false;
                    }

                    var target = new URL(url || window.location.href, window.location.origin);
                    gtag("event", "page_view", {
                        page_location: target.href,
                        page_path: target.pathname + target.search + target.hash,
                        page_title: title || document.title || "Astrodaiva"
                    });
                    return true;
                }
            };
        })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9EPVXNMWJX"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/pwa/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/pwa/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/pwa/favicon-16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Muli:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/app.css?v=20260602-ipad-boot-v1" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-card" role="status" aria-live="polite">
                <div class="boot-brand" aria-label="Astrodaiva Kalendorius">
                    <img class="boot-logo"
                         src="img/astrodaiva-logo.png"
                         alt="Astrodaiva" />
                </div>
                <div class="boot-progress" aria-hidden="true">
                    <span></span>
                </div>
                <div class="boot-status" data-loading-label>Kraunasi</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get("redirect");

            if (!redirect || redirect.charAt(0) !== "/" || redirect.indexOf("//") === 0) {
                return;
            }

            try {
                var target = new URL(redirect, window.location.origin);
                if (target.origin === window.location.origin) {
                    window.history.replaceState(null, "", target.pathname + target.search + target.hash);
                }
            } catch (error) {
                // Ignore malformed fallback redirects and let Blazor load normally.
            }
        })();
    </script>

    <script>
        (function () {
            var label = document.querySelector("[data-loading-label]");
            var culture = "lt-LT";
            try {
                culture = window.localStorage.getItem("blazorCulture") || culture;
            } catch (error) {
                culture = "lt-LT";
            }

            if (label) {
                label.textContent = culture.toLowerCase().indexOf("lt") === 0 ? "Kraunasi" : "Loading";
            }
        })();
    </script>

    <script>
        window.ui = {
            shouldUseOverlay: function () {
                var small = window.innerWidth <= 900;
                var touch = navigator.maxTouchPoints > 0 ||
                    (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
                return small && touch;
            }
        };

        window.blazorCulture = {
            get: function () {
                try {
                    return window.localStorage.getItem('blazorCulture') || 'lt-LT';
                } catch (error) {
                    return 'lt-LT';
                }
            },
            set: function (value) {
                try {
                    window.localStorage.setItem('blazorCulture', value);
                } catch (error) {
                    // Keep the current culture in memory only when storage is blocked.
                }
            }
        };

        window.adminAccess = {
            getToken: function (tokenKey, expiresKey) {
                var token = window.sessionStorage.getItem(tokenKey);
                var expiresUtc = window.sessionStorage.getItem(expiresKey);

                if (!token || !expiresUtc || Date.parse(expiresUtc) <= Date.now()) {
                    window.sessionStorage.removeItem(tokenKey);
                    window.sessionStorage.removeItem(expiresKey);
                    return "";
                }

                return token;
            },
            setToken: function (tokenKey, expiresKey, token, expiresUtc) {
                window.sessionStorage.setItem(tokenKey, token || "");
                window.sessionStorage.setItem(expiresKey, expiresUtc || "");
            },
            lock: function (tokenKey, expiresKey) {
                window.sessionStorage.removeItem(tokenKey);
                window.sessionStorage.removeItem(expiresKey);
            }
        };

        window.modalLayer = {
            setAdminModalOpen: function (open) {
                document.body.classList.toggle('admin-modal-open', !!open);
            },
            setInterpretationsOpen: function (open) {
                document.body.classList.toggle('admin-interpretations-open', !!open);
                document.body.classList.toggle('admin-modal-open', !!open);
            },
            setMobileDayOverlayOpen: function (open) {
                document.body.classList.toggle('mobile-day-overlay-open', !!open);
            }
        };

        window.downloadTextFile = function (fileName, text) {
            var blob = new Blob([text], { type: "application/json;charset=utf-8" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'astrodb.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };
    </script>

    <script src="js/activitySlider.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: window.blazorCulture.get()
        }).catch(function (error) {
            console.error("Astrodaiva Blazor startup failed.", error);
            var label = document.querySelector("[data-loading-label]");
            if (label) {
                var culture = window.blazorCulture.get() || "lt-LT";
                label.textContent = culture.toLowerCase().indexOf("lt") === 0
                    ? "Nepavyko paleisti. Atnaujinkite puslapį."
                    : "Could not start. Refresh the page.";
            }
        });

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                var baseUrl = new URL(document.baseURI);
                navigator.serviceWorker
                    .register(new URL("service-worker.js", baseUrl).href, { scope: baseUrl.href })
                    .catch(function (error) {
                        console.warn("Astrodaiva service worker registration failed.", error);
                    });
            });
        }
    </script>
</body>
</html>
