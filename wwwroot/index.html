<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Astrodaiva</title>
    <base href="./" />
    <link href="css/app.css?v=20260511-premium-theme" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>

    <script>
        window.ui = {
            shouldUseOverlay: function () {
                const small = window.innerWidth <= 900;
                const touch = navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
                return small && touch;
            }
        };

        window.blazorCulture = {
            get: function () {
                return window.localStorage.getItem('blazorCulture') || 'lt-LT';
            },
            set: function (value) {
                window.localStorage.setItem('blazorCulture', value);
            }
        };

        window.adminAccess = {
            getToken: function (tokenKey, expiresKey) {
                const token = window.sessionStorage.getItem(tokenKey);
                const expiresUtc = window.sessionStorage.getItem(expiresKey);

                if (!token || !expiresUtc || Date.parse(expiresUtc) <= Date.now()) {
                    window.sessionStorage.removeItem(tokenKey);
                    window.sessionStorage.removeItem(expiresKey);
                    return "";
                }

                return token;
            },
            setToken: function (tokenKey, expiresKey, token, expiresUtc) {
                window.sessionStorage.setItem(tokenKey, token || "");
                window.sessionStorage.setItem(expiresKey, expiresUtc || "");
            },
            lock: function (tokenKey, expiresKey) {
                window.sessionStorage.removeItem(tokenKey);
                window.sessionStorage.removeItem(expiresKey);
            }
        };

        window.downloadTextFile = function (fileName, text) {
            const blob = new Blob([text], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'astrodb.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };
    </script>

    <script src="js/activitySlider.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: window.blazorCulture.get()
        });
    </script>
</body>
</html>
