<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Astrodaiva</title>
    <base href="./" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Muli:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/app.css?v=20260517-api-loading-v2" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-card" role="status" aria-live="polite">
                <div class="boot-orbit" aria-hidden="true">
                    <span></span>
                </div>
                <div class="boot-copy">
                    <div class="boot-kicker">Astrodaiva</div>
                    <div class="boot-title">Loading calendar from database</div>
                    <div class="boot-subtitle">Waiting up to 5 seconds for the default snapshot.</div>
                </div>
                <div class="boot-progress" aria-hidden="true">
                    <span></span>
                </div>
                <div class="boot-footer">If the server is slow, local JSON opens while the database keeps connecting.</div>
            </div>
        </div>
    </div>

    <script>
        window.ui = {
            shouldUseOverlay: function () {
                const small = window.innerWidth <= 900;
                const touch = navigator.maxTouchPoints > 0 || matchMedia("(pointer: coarse)").matches;
                return small && touch;
            }
        };

        window.blazorCulture = {
            get: function () {
                return window.localStorage.getItem('blazorCulture') || 'lt-LT';
            },
            set: function (value) {
                window.localStorage.setItem('blazorCulture', value);
            }
        };

        window.adminAccess = {
            getToken: function (tokenKey, expiresKey) {
                const token = window.sessionStorage.getItem(tokenKey);
                const expiresUtc = window.sessionStorage.getItem(expiresKey);

                if (!token || !expiresUtc || Date.parse(expiresUtc) <= Date.now()) {
                    window.sessionStorage.removeItem(tokenKey);
                    window.sessionStorage.removeItem(expiresKey);
                    return "";
                }

                return token;
            },
            setToken: function (tokenKey, expiresKey, token, expiresUtc) {
                window.sessionStorage.setItem(tokenKey, token || "");
                window.sessionStorage.setItem(expiresKey, expiresUtc || "");
            },
            lock: function (tokenKey, expiresKey) {
                window.sessionStorage.removeItem(tokenKey);
                window.sessionStorage.removeItem(expiresKey);
            }
        };

        window.modalLayer = {
            setAdminModalOpen: function (open) {
                document.body.classList.toggle('admin-modal-open', !!open);
            },
            setInterpretationsOpen: function (open) {
                document.body.classList.toggle('admin-interpretations-open', !!open);
                document.body.classList.toggle('admin-modal-open', !!open);
            },
            setMobileDayOverlayOpen: function (open) {
                document.body.classList.toggle('mobile-day-overlay-open', !!open);
            }
        };

        window.downloadTextFile = function (fileName, text) {
            const blob = new Blob([text], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName || 'astrodb.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        };
    </script>

    <script src="js/activitySlider.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            applicationCulture: window.blazorCulture.get()
        });
    </script>
</body>
</html>
